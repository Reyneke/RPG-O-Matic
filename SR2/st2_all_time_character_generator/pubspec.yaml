name: st2_all_time_character_generator
description: "Shadowrun 2. Edition Character Generator - Cross-Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Code Generation (Models)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Theme & UI
  google_fonts: ^8.2.0

  # PDF Export
  pdf: ^3.11.2

  # Logging
  logger: ^2.5.0

  # Utilities
  fast_immutable_collections: ^11.0.3
  shared_preferences: ^2.3.5
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  drift_dev: any
  freezed: any
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true